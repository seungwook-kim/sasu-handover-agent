[project]
name = "sasu"
version = "0.1.0"
description = "떠난 개발자 대신 답하는 SI 인수인계 에이전트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
sasu = "sasu.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sasu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
