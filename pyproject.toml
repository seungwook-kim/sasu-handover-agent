[project]
name = "sasu"
version = "0.1.0"
description = "떠난 개발자 대신 답하는 SI 인수인계 에이전트"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 0.26.0은 여러 파일을 연달아 파싱하면 Windows에서 access violation이 난다
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23",
    "typer>=0.12",
    "rich>=13",
    "openpyxl>=3.1.5",
    "sqlite-vec>=0.1.9",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
    "tree-sitter-python>=0.23",
]

[project.scripts]
sasu = "sasu.cli:app"

[project.optional-dependencies]
local-embed = [
    "fastembed>=0.8.1",
]
mcp = [
    "mcp>=2.2,<3",  # 2.x API (MCPServer)
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sasu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
